# Eligius — Deploy the OTP registration plugin to the live host (TD-10).
#
# WHY: the repo's server/eligius-otp.php makes national_code OPTIONAL
# (TD-10, commit 6511581) but the live host wp.mrkiyan.ir still runs the
# OLD copy that REQUIRES it — the Android 1.3.12 app no longer sends the
# field, so live registration fails with rest_missing_callback_param.
#
# SAFETY: workflow_dispatch + push gated to the plugin/workflow files only;
# backs up the live file BEFORE overwriting; verifies the uploaded bytes
# byte-for-byte (sha256) against the repo version; deploy-only (no tag,
# no APK release, no app artifacts).
name: Deploy OTP plugin (live)

on:
  push:
    branches: [main]
    paths:
      - "server/eligius-otp.php"
      - ".github/workflows/deploy-otp-plugin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-otp:
    name: Deploy eligius-otp.php to wp.mrkiyan.ir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate wp-content + eligius-otp.php over FTP (diagnostic)
        env:
          FTP_HOST: ${{ secrets.ELIGIUS_FTP_HOST }}
          FTP_USER: ${{ secrets.ELIGIUS_FTP_USER }}
          FTP_PASS: ${{ secrets.ELIGIUS_FTP_PASS }}
          FTP_PATH: ${{ secrets.ELIGIUS_FTP_PATH }}
        run: |
          # walk from the known-good APK upload dir (ELIGIUS_FTP_PATH) up to
          # the site root, LISTING each level until wp-content appears —
          # listings show filenames only (no secret values are printed).
          P="${FTP_PATH%/}"
          DIRS=("$P" "$(dirname "$P")" "$(dirname "$(dirname "$P")")" "/")
          FOUND=""
          for d in "${DIRS[@]}"; do
            case "$d" in /*) dd="${d#/}";; *) dd="$d";; esac
            URL="ftp://$FTP_HOST/$dd/"
            echo "== LIST $URL"
            L=$(curl -s --max-time 30 "$URL" --user "$FTP_USER:$FTP_PASS") || true
            [ -z "$L" ] && { echo "   (empty or unreachable)"; continue; }
            echo "$L" | sed 's/^/   | /' | head -50
            if echo "$L" | grep -qi "wp-content"; then
              FOUND="$dd"
              echo "FOUND wp-content under: /$dd"
              break
            fi
          done
          if [ -z "$FOUND" ]; then
            echo "::error::wp-content is not reachable over FTP with the ELIGIUS_FTP_* account (probed: APK dir and its parents). Deploy manually via the hosting panel."
            exit 1
          fi
          # locate eligius-otp.php under wp-content/plugins
          for c in "$FOUND/wp-content/plugins" "$FOUND/plugins"; do
            URL="ftp://$FTP_HOST/${c#/}/"
            echo "== LIST $URL"
            L=$(curl -s --max-time 30 "$URL" --user "$FTP_USER:$FTP_PASS") || true
            [ -z "$L" ] && { echo "   (empty or unreachable)"; continue; }
            echo "$L" | sed 's/^/   | /' | head -50
            if echo "$L" | grep -qi "eligius-otp"; then
              echo "PLUGINS_DIR=$c" >> "$GITHUB_ENV"
              echo "FOUND eligius-otp.php under: /$c"
              break
            fi
          done
          if ! grep -qE "^PLUGINS_DIR=" "$GITHUB_ENV"; then
            echo "::error::eligius-otp.php was not found under the probed wp-content paths — deploy manually via the hosting panel."
            exit 1
          fi

      - name: Backup current live plugin
        env:
          FTP_HOST: ${{ secrets.ELIGIUS_FTP_HOST }}
          FTP_USER: ${{ secrets.ELIGIUS_FTP_USER }}
          FTP_PASS: ${{ secrets.ELIGIUS_FTP_PASS }}
        run: |
          curl -s --max-time 60 "ftp://$FTP_HOST/$PLUGINS_DIR/eligius-otp.php" --user "$FTP_USER:$FTP_PASS" -o live-backup-eligius-otp.php
          test -s live-backup-eligius-otp.php || { echo "::error::could not download the live plugin for backup — aborting before any change."; exit 1; }
          echo "backup size: $(stat -c %s live-backup-eligius-otp.php) bytes"

      - name: Upload fixed plugin (national_code optional — TD-10)
        run: |
          curl -sS --max-time 60 -T "server/eligius-otp.php" "ftp://$FTP_HOST/$PLUGINS_DIR/eligius-otp.php" --user "$FTP_USER:$FTP_PASS"

      - name: Verify uploaded bytes match the repo version
        env:
          FTP_HOST: ${{ secrets.ELIGIUS_FTP_HOST }}
          FTP_USER: ${{ secrets.ELIGIUS_FTP_USER }}
          FTP_PASS: ${{ secrets.ELIGIUS_FTP_PASS }}
        run: |
          curl -s --max-time 60 "ftp://$FTP_HOST/$PLUGINS_DIR/eligius-otp.php" --user "$FTP_USER:$FTP_PASS" -o uploaded-check.php
          A=$(sha256sum server/eligius-otp.php | cut -d' ' -f1)
          B=$(sha256sum uploaded-check.php | cut -d' ' -f1)
          echo "repo  sha256: $A"
          echo "live  sha256: $B"
          [ "$A" = "$B" ] || { echo "::error::the uploaded file differs from the repo version — investigate before retrying."; exit 1; }
          echo "DEPLOY VERIFIED byte-for-byte."

      - name: Keep the live backup as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-plugin-backup
          path: live-backup-eligius-otp.php
          if-no-files-found: error
